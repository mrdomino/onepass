[package]
name = "onepass"
version = "3.1.1"
categories = ["command-line-utilities"]
edition.workspace = true
keywords = ["password", "cryptography", "deterministic"]
license = "AGPL-3.0-only"
readme = "README.md"
repository.workspace = true
description = "A mostly-stateless deterministic password manager"

exclude = [
    ".githook/*",
    ".github/**",
    ".gitignore",
    "example/**",
    "data/onepass.entitlements",
    "onepass.provisionprofile",
]

[workspace]
resolver = "3"
members = ["crates/base", "crates/conf", "crates/seed"]

[workspace.package]
edition = "2024"
repository = "https://github.com/mrdomino/onepass"

[features]
default = [
    "keyring",
    "readpass-vendored",
]
keyring = [
    "apple-native-keyring-store/keychain",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
macos-biometry = ["apple-native-keyring-store/protected"]
readpass-libbsd = ["readpassphrase-3/libbsd-static"]
readpass-vendored = ["readpassphrase-3/linux-vendored"]

[patch.crates-io]
onepass-base = { path = "crates/base" }
onepass-conf = { path = "crates/conf" }
onepass-seed = { path = "crates/seed" }

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env", "unicode", "wrap_help"] }
keyring-core = "^1.0.0"
onepass-conf = "0.7.2"
onepass-seed = "0.4.0"
secrecy = "0.10.3"

[dependencies.readpassphrase-3]
version = "1.0.2"
default-features = false
features = [
    "windows-vendored",
    "zeroize",
]

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = {
    version = "^1.0.0",
    features = ["rt-async-io-crypto-openssl"],
    optional = true,
}

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "^1.0.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "^1.1.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
