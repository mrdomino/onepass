version: 2
updates:
  - package-ecosystem: "cargo"
    labels: ["dependencies", "main"]
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: main
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: main
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    labels: ["dependencies", "v2-dev"]
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: v2-dev
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # We depend on the outdated crypto-bigint v0.6.1 RNG output.
      - dependency-name: "crypto-bigint"
        versions: [ ">=0.7.0" ]
      # Pinned down by cypto-bigint.
      - dependency-name: "rand_core"
        versions: [ ">=0.9.0" ]
      # Pinned down by crypto-bigint.
      - dependency-name: "rand_chacha"
        versions: [ ">=0.4.0" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: v2-dev
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
